[package]
name = "droidmirror"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Standalone desktop Android screen mirror"

[[bin]]
name = "droidmirror"
path = "src/main.rs"

[features]
default = ["openh264"]
openh264 = ["dep:openh264"]

[dependencies]
droidmirror-client = { workspace = true }
droidmirror-proto = { workspace = true }
droidmirror-transport = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
openh264 = { version = "0.8", optional = true, default-features = false, features = ["source"] }
wgpu = "24"
winit = "0.30"
pollster = "0.4"
arboard = "3"
bytemuck = { version = "1", features = ["derive"] }
png = "0.17"
gif = "0.13"
mp4 = "0.14"
bytes = "1"
